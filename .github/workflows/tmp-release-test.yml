name: TMP release test
on:
  push:
    branches: [ci-diag]
jobs:
  t:
    runs-on: ubuntu-24.04
    env:
      ANDROID_API_LEVEL: '37.0'
      ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '9.6.0' }
      - run: bash ./scripts/setup-android-sdk.sh
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/t.jks" -storepass testtesttest -keypass testtesttest -alias t -keyalg RSA -keysize 2048 -validity 1 -dname "CN=t"
          export SIGNING_STORE_FILE="$RUNNER_TEMP/t.jks" SIGNING_STORE_PASSWORD=testtesttest SIGNING_KEY_ALIAS=t SIGNING_KEY_PASSWORD=testtesttest VERSION_NAME=0.0.1 VERSION_CODE=1
          gradle --no-daemon clean testDebugUnitTest lintRelease assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk && echo "::notice::release APK OK $(stat -c%s app/build/outputs/apk/release/app-release.apk) bytes"
      - if: failure()
        shell: bash
        run: |
          msg=$(grep -A 25 -E 'What went wrong|error:|FAILED' "$RUNNER_TEMP/gradle.log" | head -n 60)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error::${msg}"
