name: Publish signed APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example v1.0.0 (created on the selected branch if it does not exist yet)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_API_LEVEL: '37.0'
      ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Validate tag and signing secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $RELEASE_TAG"; exit 1; }
          for name in KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing required GitHub secret: $name"; exit 1; }
          done

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out or create release tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git checkout -q "$RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "DOSDeck Launcher ${RELEASE_TAG#v}"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "::notice::Created tag $RELEASE_TAG on $(git rev-parse --short HEAD)"
          else
            echo "Tag $RELEASE_TAG not found"; exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 37
        shell: bash
        run: bash ./scripts/setup-android-sdk.sh

      - name: Restore signing keystore
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/dosdeck-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
          chmod 600 "$STORE_FILE"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${RELEASE_TAG#v}"
          (( 10#$MINOR < 1000 && 10#$PATCH < 1000 )) || { echo "Minor and patch versions must be below 1000"; exit 1; }
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          (( VERSION_CODE > 0 && VERSION_CODE <= 2100000000 )) || { echo "Version code is outside Android's supported range"; exit 1; }
          echo "SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build, test and lint signed release
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean testDebugUnitTest lintRelease assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report Gradle failure
        if: failure()
        shell: bash
        run: |
          [[ -f "$RUNNER_TEMP/gradle.log" ]] || exit 0
          msg=$(grep -A 25 -E 'What went wrong|error:|FAILED' "$RUNNER_TEMP/gradle.log" | head -n 60)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
          echo "::error title=Gradle build failed::${msg}"

      - name: Verify APK signature and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          RELEASE_DIR="$RUNNER_TEMP/release"
          VERSION="${RELEASE_TAG#v}"
          mkdir -p "$RELEASE_DIR"
          APK="$RELEASE_DIR/DOSDeck-Launcher-${VERSION}.apk"
          cp "$SOURCE_APK" "$APK"
          "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs "$APK"
          (cd "$RELEASE_DIR" && sha256sum "$(basename "$APK")" > "DOSDeck-Launcher-${VERSION}.apk.sha256")
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "CHECKSUM=$RELEASE_DIR/DOSDeck-Launcher-${VERSION}.apk.sha256" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$CHECKSUM" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" "$CHECKSUM" \
              --verify-tag \
              --generate-notes \
              --title "DOSDeck Launcher ${RELEASE_TAG#v}"
          fi

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dosdeck-signed-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.APK }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error
          retention-days: 30
