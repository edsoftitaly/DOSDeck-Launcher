plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('SIGNING_STORE_FILE')
def releaseStorePassword = System.getenv('SIGNING_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }

def ciVersionName = System.getenv('VERSION_NAME') ?: '1.0.0-dev'
def ciVersionCode = (System.getenv('VERSION_CODE') ?: '1') as Integer

android {
    namespace 'com.edoardonapoli.dosdeck'
    compileSdk 37

    defaultConfig {
        applicationId 'com.edoardonapoli.dosdeck'
        minSdk 29
        targetSdk 37
        versionCode ciVersionCode
        versionName ciVersionName

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        vectorDrawables.useSupportLibrary = false
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        // MainActivity reads BuildConfig.VERSION_NAME; AGP 8+ no longer generates it by default.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        sarifReport true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Fails when the four release-signing environment variables are missing.'
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is not configured. Set SIGNING_STORE_FILE, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD.')
        }
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    dependsOn tasks.named('verifyReleaseSigning')
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
